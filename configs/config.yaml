reproducibility:
  seed: 42
  deterministic_cudnn: true
  num_workers: 4

outcome:
  schema: "binary" # binary or ternary
  time_window_months: 60.0

data:
  case_manifest_path: "data/manifests/cases.parquet"
  feature_manifest_path: "data/manifests/feature_manifest.parquet"
  cache_dir: "data/cache"

model:
  omics_embed_dim: 256
  vision_embed_dim: 256
  fused_dim: 512
  dropout: 0.3
  vision_backbone: "resnet50"

training:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.001
  epochs: 30
  early_stopping_patience: 10
  loss_weights:
    ce: 1.0
    cox: 0.2

output_dir: "data/results"
