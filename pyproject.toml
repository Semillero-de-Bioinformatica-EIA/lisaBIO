[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcis-biomarkers"
version = "0.1.0"
description = "Identificación de biomarcadores moleculares y morfológicos asociados con la progresión de CDIS a carcinoma invasivo mediante IA y análisis multi-ómico"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Grupo de Investigación Bioinformática y Patología Digital" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "lifelines>=0.27.0",
    "scanpy>=1.9.3",
    "anndata>=0.9.0",
    "gseapy>=1.0.4",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "shap>=0.42.0",
    "h5py>=3.8.0",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.3.0",
    "ruff>=0.0.260",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
